<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>cybterra · Cyber-Security-Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--paper:#EFEDE8;--card:#FFF;--ink:#2A1512;--brand:#340B09;--bsoft:#F2E7E5;--mut:#6E6560;--dim:#A79E99;--line:#E6E1D9;--line2:#D8D0C6;--green:#3E8E5A;--gsoft:#E9F1EA;--amber:#B8841F;--asoft:#F6EDD8;--red:#C24039;--rsoft:#F6E6E3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;padding:30px 22px 80px}
.brand{margin-bottom:22px}
.wm{font-family:'Poppins';font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--ink)}
.bt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:1px}
.eye{font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);display:flex;align-items:center;gap:10px;margin-bottom:16px}
.eye::before{content:"";width:24px;height:2px;background:var(--brand)}
h1.h{font-family:'Poppins';font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.07;letter-spacing:-.02em;margin:0 0 14px}
h1.h em{font-style:normal;color:var(--brand)}
.lead{color:var(--mut);font-size:16px;line-height:1.6;max-width:620px;margin:0 0 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(42,21,18,.04)}
.card h3{font-family:'Poppins';font-weight:600;font-size:16px;margin:0 0 4px;display:flex;gap:9px;align-items:center}
.card .sub{color:var(--mut);font-size:13.5px;margin:0 0 16px}
.fg{display:grid;gap:12px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-weight:600;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.inp,.sel{width:100%;background:var(--paper);border:1px solid var(--line2);border-radius:9px;padding:12px 13px;color:var(--ink);font-family:inherit;font-size:14px}
.inp:focus,.sel:focus{outline:none;border-color:var(--brand)}
.btn{border:none;cursor:pointer;font-family:'Poppins';font-weight:600;font-size:14.5px;padding:13px 24px;border-radius:10px;display:inline-flex;align-items:center;gap:9px;transition:.14s}
.btn-p{background:var(--brand);color:var(--paper)}.btn-p:hover{background:#210706;transform:translateY(-1px)}.btn-p:disabled{opacity:.36;cursor:not-allowed;transform:none}
.btn-g{background:var(--card);border:1px solid var(--line2);color:var(--mut)}.btn-g:hover{color:var(--ink);border-color:var(--dim)}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:14px}.meta span{display:flex;align-items:center;gap:7px}.meta i{width:5px;height:5px;border-radius:50%;background:var(--brand);display:inline-block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{cursor:pointer;border:1.5px solid var(--line2);background:var(--paper);border-radius:9px;padding:12px 14px;font-family:inherit;font-size:14px;color:var(--mut);display:flex;align-items:center;gap:10px;transition:.12s;text-align:left}
.opt:hover{border-color:var(--dim)}.opt.on{font-weight:600;background:#fff}
.opt .d{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;flex:none}.opt.on .d{background:currentColor;box-shadow:inset 0 0 0 2px #fff}
.pbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 14px;margin-bottom:6px}
.ptop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.ptop b{font-family:'Poppins';font-size:13.5px}.ptop span{font-size:11px;color:var(--dim)}
.ptrack{height:5px;background:var(--line);border-radius:4px;overflow:hidden}.pfill{height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
.dots{display:flex;gap:4px;margin-top:10px}.dot{flex:1;height:4px;border-radius:3px;background:var(--line);cursor:pointer}.dot.done{background:var(--brand)}.dot.cur{background:var(--ink)}
.secn{font-weight:600;font-size:11.5px;color:var(--brand);letter-spacing:.09em}
.sect{font-family:'Poppins';font-weight:700;font-size:25px;letter-spacing:-.01em;margin:5px 0 5px}.seci{color:var(--mut);font-size:15px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:19px 20px;margin-bottom:11px;box-shadow:0 1px 7px rgba(42,21,18,.03)}
.qnum{font-size:11px;color:var(--dim);font-weight:600}.qt{font-size:15.5px;line-height:1.5;margin:6px 0 14px;font-weight:500;display:flex;align-items:flex-start;gap:8px}
.info{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--dim);color:var(--dim);font-size:11px;font-weight:700;font-style:italic;font-family:Georgia,serif;display:inline-grid;place-items:center;cursor:help;position:relative;margin-top:2px;transition:.15s}
.info:hover{border-color:var(--brand);color:var(--brand)}
.info .tip{visibility:hidden;opacity:0;position:absolute;left:50%;top:26px;transform:translateX(-50%);width:260px;max-width:70vw;background:var(--ink);color:#F4EEE9;font-size:12.5px;font-weight:400;font-style:normal;font-family:'DM Sans';line-height:1.5;text-align:left;padding:11px 13px;border-radius:9px;box-shadow:0 8px 24px rgba(42,21,18,.22);z-index:20;transition:opacity .16s;pointer-events:none}
.info .tip::before{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:var(--ink)}
.info:hover .tip,.info:focus .tip{visibility:visible;opacity:1}
@media print{.info{display:none}}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.rhero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:16px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;box-shadow:0 2px 14px rgba(42,21,18,.05)}
.score .big{font-family:'Poppins';font-weight:700;font-size:50px;line-height:1;letter-spacing:-.02em}.score .lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-top:6px;font-weight:600}
.rhero-txt h2{font-family:'Poppins';font-weight:600;font-size:21px;margin:0 0 8px}
.rlvl{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:5px 12px;border-radius:20px;margin-bottom:10px}.rhero-txt p{color:var(--mut);font-size:14px;line-height:1.6;margin:0}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
.bars{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center}
.bart{font-size:12.5px}.bart small{color:var(--dim);margin-right:6px;font-weight:600}.barv{font-size:12px;font-weight:700}
.bartrack{grid-column:1/-1;height:6px;background:var(--paper);border:1px solid var(--line);border-radius:5px;overflow:hidden}.barfill{height:100%;border-radius:5px}
.mgmt{font-size:14.5px;line-height:1.7;color:var(--mut)}.mgmt b{color:var(--ink)}
.strength{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);padding:6px 11px;background:var(--gsoft);border-radius:8px;margin:4px 6px 0 0}
.gap{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:9px;background:var(--card)}
.gap-h{display:flex;gap:11px;align-items:flex-start}.badge{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:20px;flex:none;margin-top:2px}
.gap-q{font-weight:600;font-size:14.5px;line-height:1.45}.gap-sec{font-size:10.5px;color:var(--dim);margin-top:3px;font-weight:500}
.gap-rec{margin-top:11px;padding:12px 14px;background:var(--paper);border-radius:9px;font-size:13.5px;line-height:1.55}.gap-rec b{color:var(--brand)}
.cta{background:var(--brand);border-radius:18px;padding:26px;color:var(--paper);margin-top:20px}
.cta h3{font-family:'Poppins';font-weight:600;font-size:20px;margin:0 0 8px;color:#fff}.cta p{color:#E3CFCC;font-size:14px;line-height:1.6;margin:0 0 18px}
.cta .btn-p{background:var(--paper);color:var(--brand)}.cta .btn-p:hover{background:#fff}
.letter{display:flex;align-items:center;gap:13px;padding:18px 22px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.letter .li{flex:1}.letter .lc{text-align:right;font-size:12px;color:var(--mut);line-height:1.5}.letter .lc b{color:var(--brand)}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut)}.foot b{color:var(--brand)}
.disc{font-size:10.5px;color:var(--dim);line-height:1.7;margin-top:14px}
.toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:14px}
@media(max-width:640px){.row2,.opts,.chartgrid,.rhero{grid-template-columns:1fr}.rhero,.letter{text-align:center}.letter .lc{text-align:center}}
@media print{body{background:#fff}.toolbar,.cta,.nav,.pbar{display:none!important}.card,.rhero,.gap,.letter{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   cybterra · Cyber-Security-Assessment — Single-File / Vanilla JS
   Eigenständige .html-Datei (gleiche Bauweise wie der Impactrechner),
   ohne Build, per Wix-HTML-Embed einbindbar. Ohne Logo.
   Lead-Versand: TODO fetch() markiert. Persistenz via localStorage.
   ========================================================= */
var CONTACT={mail:"office@cybterra.com",web:"cybterra.com"};
function brand(sub){return '<div class="brand"><div class="wm">cybterra'+(sub?' · '+sub:'')+'</div></div>';}
function letter(){return '<div class="letter"><div class="li"><div class="wm">cybterra</div><div class="bt">Cyber-Security &amp; NIS2-Compliance</div></div><div class="lc"><b>cybterra</b><br>'+CONTACT.mail+'<br>'+CONTACT.web+'</div></div>';}
function foot(){return '<div class="foot"><div><b>cybterra</b> · Cyber-Security &amp; NIS2</div><div>'+CONTACT.mail+' · '+CONTACT.web+'</div></div>'+
'<p class="disc">Automatisierte Erstorientierung auf Basis Ihrer Selbstauskunft — ersetzt keine individuelle Sicherheitsprüfung oder Rechtsberatung. © cybterra · '+new Date().toLocaleDateString("de-DE")+'.</p>';}

var BRANCHEN=[["","Bitte wählen…"],["produktion","Industrie / Produktion"],["gesundheit","Gesundheitswesen"],["it","IT / Software"],["handel","Handel / E-Commerce"],["finanzen","Finanzen / Versicherung"],["energie","Energie / Versorgung"],["logistik","Logistik / Transport"],["dienstleistung","Dienstleistung"],["oeffentlich","Öffentlicher Sektor"],["sonstige","Sonstige"]];
var OPTS=[{v:"ja",t:"Ja",val:2,c:"#3E8E5A"},{v:"teilweise",t:"Teilweise",val:1,c:"#B8841F"},{v:"nein",t:"Nein",val:0,c:"#C24039"},{v:"na",t:"Keine Relevanz",val:null,c:"#A79E99"}];
var BASE=[
{id:"s1",n:"01",short:"Schwachstellen",t:"Sicherheitslücken & Patch-Management",bsig:"§ 30 Abs. 2 Nr. 5 BSIG",intro:"Wie zuverlässig erkennen und schließen Sie bekannte Schwachstellen?",q:[
{id:"1.1",q:"Haben Sie einen vollständigen Überblick über alle eingesetzte Software?",info:"Gemeint ist eine aktuelle Liste aller Programme und Systeme im Unternehmen – inkl. Version und wer dafür zuständig ist. Nur was Sie kennen, können Sie schützen.",rec:"Zentrales Software- und Asset-Inventar mit Version und Verantwortlichem führen."},
{id:"1.2",q:"Existiert ein definierter Prozess für Updates und Patches?",info:"Ein „Patch“ ist ein Sicherheitsupdate des Herstellers. Gefragt ist, ob es eine feste Vorgehensweise gibt, wer solche Updates wann einspielt – statt zufällig.",rec:"Patch-Prozess mit Zuständigkeiten, Testschritt und festen Wartungsfenstern dokumentieren."},
{id:"1.3",q:"Werden Updates schnellstmöglich nach Veröffentlichung eingespielt?",info:"Sobald ein Hersteller ein Sicherheitsupdate veröffentlicht, kennen auch Angreifer die Lücke. Je schneller Sie einspielen, desto kleiner das Zeitfenster für Angriffe.",rec:"Kritische Updates binnen 72 h einspielen, idealerweise automatisiert und nach CVSS priorisiert."},
{id:"1.4",q:"Sind Quellen definiert, über die Sie über neue Schwachstellen informiert werden?",info:"Erfahren Sie aktiv von neuen Sicherheitslücken? Z. B. über die Warnmeldungen des BSI (CERT-Bund) oder Hinweise Ihrer Software-Hersteller.",rec:"CERT-Bund-Meldungen des BSI und Hersteller-Advisories abonnieren, verantwortliche Rolle benennen."},
{id:"1.5",q:"Sind administrative Rechte auf das Nötigste beschränkt?",info:"„Admin-Rechte“ erlauben, alles auf einem System zu ändern. Wenn jeder Nutzer sie hat, kann ein gekapertes Konto großen Schaden anrichten. Least Privilege = nur so viel Rechte wie nötig.",rec:"Lokale Admin-Rechte konsequent reduzieren (Least Privilege)."}]},
{id:"s2",n:"02",short:"Zugänge",t:"Benutzerzugänge absichern",bsig:"§ 30 Abs. 2 Nr. 9/10 BSIG",intro:"Wie gut sind Konten, Passwörter und Fernzugriffe geschützt?",q:[
{id:"2.1",q:"Nutzen Sie eine Passwort-Richtlinie gemäß BSI-Empfehlung?",info:"Klare Vorgaben für Passwörter (z. B. Mindestlänge, Passwort-Manager), die auch an die Mitarbeitenden kommuniziert sind.",rec:"Mindestlänge 12+, Passwort-Manager, keine erzwungenen periodischen Wechsel."},
{id:"2.2",q:"Sind kritische Konten und Fernzugänge mit MFA / 2FA abgesichert?",info:"MFA / 2FA = eine zweite Bestätigung zusätzlich zum Passwort (z. B. Code aufs Handy). Schützt selbst dann, wenn ein Passwort gestohlen wird.",rec:"MFA verpflichtend für Admins, Fernzugriffe und Cloud; FIDO2/Passkeys bevorzugen."},
{id:"2.3",q:"Sind Mitarbeitende sensibilisiert, Passwörter geheim zu halten?",rec:"In Onboarding und jährlicher Schulung verankern: keine Weitergabe, keine Mehrfachnutzung."},
{id:"2.4",q:"Existiert eine Zugangssicherung für mobile Geräte im Firmennetz?",info:"Sind Smartphones/Laptops, die auf Firmendaten zugreifen, gesichert (PIN, Verschlüsselung, Fernlöschung bei Verlust)?",rec:"MDM mit Verschlüsselung, Bildschirmsperre und Remote-Wipe einführen."},
{id:"2.5",q:"Werden privilegierte Zugänge gesondert verwaltet und überwacht?",info:"„Privilegiert“ = Konten mit weitreichenden Rechten (Administratoren). Diese sollten besonders geschützt und protokolliert werden.",rec:"Privileged-Access-Management: separate Admin-Konten, Just-in-Time-Rechte, Protokollierung."}]},
{id:"s3",n:"03",short:"Backup",t:"Datensicherung & Wiederherstellung",bsig:"§ 30 Abs. 2 Nr. 3 BSIG",intro:"Sind Ihre Daten gegen Verlust und Ransomware geschützt?",q:[
{id:"3.1",q:"Verfügen Sie über eine Sicherung der geschäftskritischen Daten?",info:"Ein Backup ist eine Kopie Ihrer wichtigen Daten, aus der Sie im Ernstfall wiederherstellen können.",rec:"Geschäftskritische Daten identifizieren und systematisch sichern."},
{id:"3.2",q:"Werden Backups auf mehreren unterschiedlichen Medien gesichert?",info:"Mehrere Kopien auf verschiedenen Speichern (z. B. lokal + Cloud), damit ein einzelner Defekt nicht alles vernichtet (3-2-1-Regel).",rec:"3-2-1-Regel: drei Kopien, zwei Medien, eine außer Haus."},
{id:"3.3",q:"Ist mindestens ein Backup offline / unveränderbar (immutable)?",info:"Ein Backup, das nicht dauerhaft mit dem Netz verbunden ist. Ransomware verschlüsselt erreichbare Backups mit – eine getrennte Kopie überlebt den Angriff.",rec:"Offline- oder Immutable-Kopie vorhalten — Ransomware verschlüsselt Online-Backups mit."},
{id:"3.4",q:"Werden Wiederherstellung und Funktionsfähigkeit regelmäßig geübt?",info:"Ein Backup nützt nur, wenn die Rückspielung im Ernstfall auch funktioniert. Das sollte regelmäßig getestet werden.",rec:"Wiederherstellung mind. halbjährlich testen und Recovery-Zeiten dokumentieren."},
{id:"3.5",q:"Ist der Sicherungsturnus an die Geschäftskritikalität angepasst?",info:"Wie oft gesichert wird, sollte davon abhängen, wie viel Datenverlust Sie maximal verkraften (RPO).",rec:"Sicherungshäufigkeit am tolerierbaren Datenverlust (RPO) ausrichten."}]},
{id:"s4",n:"04",short:"Bewusstsein",t:"Gefahrenbewusstsein & Schulung",bsig:"§ 30 Abs. 2 Nr. 7 BSIG",intro:"Sind Sie und Ihr Team auf aktuelle Angriffe vorbereitet?",q:[
{id:"4.1",q:"Werden Sie zeitnah über aktuelle Gefahren informiert?",rec:"BSI-Lagebild und Branchen-CERT-Informationen nutzen, um gezielt zu priorisieren."},
{id:"4.2",q:"Sind gängige Vorgehensweisen von Cyberkriminellen bekannt?",info:"Kennen Sie und Ihr Team typische Angriffe wie Phishing (gefälschte E-Mails) oder CEO-Fraud (Betrug im Namen der Chefetage)?",rec:"Muster vermitteln: Phishing, CEO-Fraud, Ransomware, Lieferketten-Angriffe."},
{id:"4.3",q:"Finden regelmäßig Schulungen statt?",rec:"Mindestens jährliche Awareness-Schulungen durchführen und dokumentieren."},
{id:"4.4",q:"Werden simulierte Phishing-Kampagnen durchgeführt?",info:"Kontrollierte Test-E-Mails, um zu sehen, wie viele Mitarbeitende auf Phishing hereinfallen würden – als Lernübung.",rec:"Phishing-Simulationen einsetzen; Klickraten zeigen den Fortschritt."},
{id:"4.5",q:"Gibt es eine niedrigschwellige Meldemöglichkeit für Verdachtsfälle?",info:"Können Mitarbeitende verdächtige E-Mails oder Vorfälle einfach und schnell melden (z. B. per Melde-Button)?",rec:"Einfachen Melde-Weg schaffen — schnelle Meldungen verhindern größere Schäden."}]},
{id:"s5",n:"05",short:"Netzwerk",t:"Netzübergänge & Netzwerksicherheit",bsig:"§ 30 Abs. 2 Nr. 1 BSIG",intro:"Wie kontrolliert ist der Übergang zwischen Ihrem Netz und dem Internet?",q:[
{id:"5.1",q:"Verfügen Sie über eine dedizierte, restriktiv konfigurierte Firewall?",info:"Eine Firewall filtert den Datenverkehr ins/aus dem Internet. „Restriktiv“ heißt: nur ausdrücklich erlaubte Verbindungen sind zugelassen.",rec:"Next-Generation-Firewall mit Default-Deny; Regelwerk dokumentieren."},
{id:"5.2",q:"Sind kritische IT-Systeme vom restlichen Netz getrennt?",info:"Netzsegmentierung: wichtige oder alte Systeme werden abgeschottet, damit ein Befall nicht das ganze Netz erreicht.",rec:"Netz segmentieren (VLANs/Zonen); Alt- und Produktionssysteme trennen."},
{id:"5.3",q:"Erfolgen externe Zugriffe nur über gesicherte Zugänge (VPN/ZTNA)?",info:"VPN = verschlüsselter Tunnel für Zugriffe von außen. Direkte offene Zugänge (z. B. RDP) sind ein häufiges Einfallstor.",rec:"Kein direkter RDP aus dem Internet; VPN mit MFA oder Zero-Trust-Access."},
{id:"5.4",q:"Gibt es eine Übersicht aller externen Zugänge inkl. Berechtigungen?",rec:"Register aller Fernzugänge führen und regelmäßig rezertifizieren."},
{id:"5.5",q:"Ist Ihr WLAN sicher konfiguriert (Trennung Gast/Firma)?",info:"Gäste sollten ein separates WLAN nutzen, das keinen Zugriff auf das Firmennetz hat.",rec:"Gäste-WLAN trennen, WPA3 und starke Schlüssel verwenden."}]},
{id:"s6",n:"06",short:"Malware",t:"Schadprogramme & E-Mail-Sicherheit",bsig:"§ 30 Abs. 2 Nr. 7/10 BSIG",intro:"Wie gut sind Endgeräte und E-Mail gegen Schadsoftware geschützt?",q:[
{id:"6.1",q:"Ist die Ausführung von Office-Makros technisch deaktiviert?",info:"Makros sind kleine Programme in Office-Dokumenten – ein klassischer Weg, um Schadsoftware einzuschleusen. Standardmäßig sollten sie blockiert sein.",rec:"Makros per Gruppenrichtlinie deaktivieren, nur signierte zulassen."},
{id:"6.2",q:"Werden externe E-Mails explizit gekennzeichnet?",info:"Ein Hinweis-Banner („Externe E-Mail“) hilft, Fälschungen zu erkennen und senkt die Phishing-Gefahr.",rec:"External-Banner aktivieren — senkt die Erfolgsquote von Phishing."},
{id:"6.3",q:"Ist die vollständige Absenderadresse sichtbar und geprüft?",info:"SPF/DKIM/DMARC sind technische Verfahren, die prüfen, ob eine E-Mail wirklich vom angegebenen Absender stammt.",rec:"SPF, DKIM und DMARC implementieren, damit gefälschte Absender erkannt werden."},
{id:"6.4",q:"Nutzen Sie eine aktuelle Antiviren- / EDR-Lösung?",info:"EDR (Endpoint Detection & Response) ist ein moderner Virenschutz, der auch neuartige Angriffe erkennt – mehr als ein klassischer Virenscanner.",rec:"Moderne EDR-Lösung mit zentralem Management statt reinem Signaturscanner."},
{id:"6.5",q:"Ist ein Web- / DNS-Filter gegen bösartige Seiten aktiv?",info:"Ein Filter, der den Zugriff auf bekannte Schad- und Phishing-Webseiten automatisch blockiert.",rec:"DNS- oder Web-Filter einsetzen, um Schad- und Phishing-Domains zu blocken."}]},
{id:"s7",n:"07",short:"Notfall",t:"Notfall- & Vorfallmanagement",bsig:"§ 30 Abs. 2 Nr. 2 BSIG",intro:"Sind Sie handlungsfähig, wenn der Ernstfall eintritt?",q:[
{id:"7.1",q:"Haben Sie einen Notfallplan für IT-Sicherheitsvorfälle?",info:"Ein dokumentierter Plan, was bei einem Angriff zu tun ist – wer was wann macht.",rec:"Incident-Response-Plan mit Erkennung, Eindämmung, Wiederanlauf, Nachbereitung."},
{id:"7.2",q:"Wird eine Notfallübung regelmäßig durchgeführt?",info:"Ein Durchspielen des Ernstfalls (z. B. Table-Top-Übung), um zu prüfen, ob der Plan im Stress funktioniert.",rec:"Mindestens jährlich eine Table-Top-Übung durchführen."},

{id:"G.6",q:"Sind Dienstleister zur Meldung von Vorfällen verpflichtet?",info:"Ihre Dienstleister sollten Sie bei Sicherheitsvorfällen fristgerecht informieren müssen.",rec:"Vertragliche Vorfall-Meldepflichten mit Fristen vereinbaren."}]}
};
function moduleFor(b){return MODULES[b]||MODULES.generic;}

var S={phase:"intro",sec:0,firma:"",branche:"",name:"",email:"",ans:{},sent:false};
try{var saved=localStorage.getItem("cybterra:assessment:v1");if(saved)S=Object.assign(S,JSON.parse(saved));}catch(e){}
function save(){try{localStorage.setItem("cybterra:assessment:v1",JSON.stringify(S));}catch(e){}}

function lvl(s){return s>=75?{t:"Solide aufgestellt",c:"#3E8E5A",bg:"#E9F1EA"}:s>=45?{t:"Handlungsbedarf",c:"#B8841F",bg:"#F6EDD8"}:{t:"Kritischer Handlungsbedarf",c:"#C24039",bg:"#F6E6E3"};}
function bc(s){return s>=75?"#3E8E5A":s>=45?"#B8841F":"#C24039";}
function esc(x){return(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function sections(){return BASE.concat([moduleFor(S.branche)]);}

function radar(data){
 var cx=160,cy=150,R=108,N=data.length,rings=4,out="";
 var pt=function(i,r){var a=-Math.PI/2+i*2*Math.PI/N;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
 for(var g=1;g<=rings;g++){var rr=R*g/rings,p="";for(var i=0;i<N;i++){var c=pt(i,rr);p+=(i?"L":"M")+c[0].toFixed(1)+" "+c[1].toFixed(1)+" ";}out+='<path d="'+p+'Z" fill="none" stroke="#DAD3C9" stroke-width="1"/>';}
 for(var i=0;i<N;i++){var e=pt(i,R);out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="#DAD3C9" stroke-width="1"/>';}
 var dp="";for(var i=0;i<N;i++){var v=Math.max(data[i].score,3);var c=pt(i,R*v/100);dp+=(i?"L":"M")+c[0].toFixed(1)+" "+c[1].toFixed(1)+" ";}
 out+='<path d="'+dp+'Z" fill="#340B09" fill-opacity="0.24" stroke="#340B09" stroke-width="2"/>';
 for(var i=0;i<N;i++){var l=pt(i,R+16),an=(l[0]<cx-5?"end":l[0]>cx+5?"start":"middle");out+='<text x="'+l[0].toFixed(1)+'" y="'+(l[1]+3).toFixed(1)+'" font-size="10" font-family="DM Sans" fill="#6E6560" text-anchor="'+an+'">'+esc(data[i].short)+'</text>';}
 return '<svg viewBox="0 0 320 300" width="100%" height="300">'+out+'</svg>';
}
function stats(){
 var secs=sections(),ans=S.ans,valOf=function(v){for(var i=0;i<OPTS.length;i++)if(OPTS[i].v===v)return OPTS[i].val;};
 var ss=secs.map(function(s){var rel=s.q.filter(function(q){return ans[q.id]&&ans[q.id]!=="na";});
  var sc=rel.length?Math.round(rel.reduce(function(a,q){return a+valOf(ans[q.id]);},0)/(rel.length*2)*100):null;
  return{id:s.id,short:s.short,t:s.t,n:s.n,score:sc};});
 var scored=ss.filter(function(s){return s.score!==null;});
 var overall=scored.length?Math.round(scored.reduce(function(a,s){return a+s.score;},0)/scored.length):0;
 var gaps=[];secs.forEach(function(s){s.q.forEach(function(q){if(ans[q.id]==="nein"||ans[q.id]==="teilweise")gaps.push({q:q.q,rec:q.rec,id:q.id,secN:s.n,secT:s.t,bsig:s.bsig,prio:ans[q.id]==="nein"?"hoch":"mittel"});});});
 gaps.sort(function(a,b){return(a.prio==="hoch"?0:1)-(b.prio==="hoch"?0:1);});
 var strengths=ss.filter(function(s){return s.score!==null&&s.score>=75;});
 var total=0,answered=0;secs.forEach(function(s){s.q.forEach(function(q){total++;if(ans[q.id])answered++;});});
 return{ss:ss,overall:overall,gaps:gaps,strengths:strengths,total:total,answered:answered,secs:secs};
}

function render(){document.getElementById("app").innerHTML='<div class="wrap">'+view()+'</div>';window.scrollTo(0,0);}
function view(){
 if(S.phase==="intro"){
  return brand("Cyber-Security-Assessment")+
  '<p class="eye">Umfassende Standortbestimmung</p><h1 class="h">Wie sicher ist Ihr Unternehmen <em>wirklich</em>?</h1>'+
  '<p class="lead">Acht Kernbereiche plus ein branchenspezifisches Fachmodul. Am Ende: Ihr Reifegrad-Profil mit priorisierten, konkreten Empfehlungen zum Download.</p>'+
  '<div class="card"><h3>Angaben zu Ihrem Unternehmen</h3><p class="sub">Ihre Branche steuert das passende Fachmodul.</p><div class="fg">'+
  '<div class="row2"><div class="field"><label>Unternehmen</label><input class="inp" data-model="firma" value="'+esc(S.firma)+'" placeholder="Muster GmbH"></div>'+
  '<div class="field"><label>Branche</label><select class="sel" data-model="branche">'+BRANCHEN.map(function(b){return '<option value="'+b[0]+'"'+(S.branche===b[0]?" selected":"")+'>'+b[1]+'</option>';}).join("")+'</select></div></div>'+
  '<div class="row2"><div class="field"><label>Ansprechpartner</label><input class="inp" data-model="name" value="'+esc(S.name)+'" placeholder="Vor- und Nachname"></div>'+
  '<div class="field"><label>E-Mail (geschäftlich)</label><input class="inp" type="email" data-model="email" value="'+esc(S.email)+'" placeholder="name@firma.de"></div></div></div></div>'+
  '<button class="btn btn-p" '+(S.firma&&S.email&&S.branche?"":"disabled")+' data-act="start">Assessment starten →</button>'+
  '<div class="meta"><span><i></i>8 Bereiche + Fachmodul</span><span><i></i>ca. 15 Minuten</span><span><i></i>Fortschritt wird gespeichert</span></div>';
 }
 if(S.phase==="quiz"){
  var st=stats(),sec=st.secs[S.sec];
  var h='<div class="pbar"><div class="ptop"><b>'+sec.t+'</b><span>'+st.answered+'/'+st.total+'</span></div>'+
  '<div class="ptrack"><div class="pfill" style="width:'+(st.answered/st.total*100)+'%"></div></div>'+
  '<div class="dots">'+st.secs.map(function(s,i){var done=s.q.every(function(q){return S.ans[q.id];});return '<div class="dot '+(i===S.sec?"cur":done?"done":"")+'" data-act="goto" data-i="'+i+'"></div>';}).join("")+'</div></div>'+
  '<div style="margin:4px 0 20px"><span class="secn">BEREICH '+sec.n+' · '+sec.short.toUpperCase()+'</span><h2 class="sect">'+sec.t+'</h2><p class="seci">'+sec.intro+'</p></div>';
  h+=sec.q.map(function(q){var ic=q.info?'<span class="info" tabindex="0">i<span class="tip">'+esc(q.info)+'</span></span>':'';return '<div class="q"><div class="qnum">Frage '+q.id+'</div><div class="qt"><span>'+q.q+'</span>'+ic+'</div><div class="opts">'+
   OPTS.map(function(o){var on=S.ans[q.id]===o.v;return '<button class="opt'+(on?" on":"")+'" data-act="opt" data-qid="'+q.id+'" data-val="'+o.v+'"'+(on?' style="color:'+o.c+';border-color:'+o.c+'"':'')+'><span class="d"></span>'+o.t+'</button>';}).join("")+'</div></div>';}).join("");
  var secDone=sec.q.every(function(q){return S.ans[q.id];});
  h+='<div class="nav"><button class="btn btn-g" data-act="prev">← Zurück</button>'+
   (S.sec<st.secs.length-1?'<button class="btn btn-p" '+(secDone?"":"disabled")+' data-act="next">Weiter →</button>':'<button class="btn btn-p" '+(secDone?"":"disabled")+' data-act="report">Auswertung anzeigen →</button>')+'</div>';
  return h;
 }
 var st=stats(),lv=lvl(st.overall);
 var h='<div class="toolbar"><button class="btn btn-g" data-act="edit">← Antworten ändern</button><button class="btn btn-g" data-act="print">⤓ Als PDF speichern</button></div>'+letter()+
 '<div class="rhero"><div class="score"><div class="big" style="color:'+lv.c+'">'+st.overall+'<span style="font-size:22px">%</span></div><div class="lbl">Sicherheits-Reifegrad</div></div>'+
 '<div class="rhero-txt"><div class="rlvl" style="color:'+lv.c+';background:'+lv.bg+'">● '+lv.t+'</div><h2>Auswertung für '+esc(S.firma||"Ihr Unternehmen")+'</h2>'+
 '<p>'+(S.branche?(BRANCHEN.filter(function(b){return b[0]===S.branche;})[0][1]+" · "):"")+st.total+' Kontrollfragen aus '+st.secs.length+' Bereichen.</p></div></div>'+
 '<div class="card"><h3><span style="color:var(--brand)">◇</span> Ihr Sicherheitsprofil</h3><p class="sub">Je weiter außen, desto besser aufgestellt.</p>'+
 '<div class="chartgrid"><div>'+radar(st.ss.map(function(s){return{short:s.short,score:s.score||0};}))+'</div><div class="bars">'+
 st.ss.map(function(s){return '<div class="barrow"><div class="bart"><small>'+s.n+'</small>'+s.t+'</div><div class="barv" style="color:'+(s.score!==null?bc(s.score):"var(--dim)")+'">'+(s.score!==null?s.score+"%":"n/a")+'</div><div class="bartrack"><div class="barfill" style="width:'+(s.score||0)+'%;background:'+(s.score!==null?bc(s.score):"var(--line2)")+'"></div></div></div>';}).join("")+'</div></div></div>';
 var krit=st.gaps.filter(function(g){return g.prio==="hoch";}).length;
 h+='<div class="card"><h3><span style="color:var(--brand)">▤</span> Zusammenfassung für die Geschäftsleitung</h3><p class="mgmt"><b>'+esc(S.firma||"Ihr Unternehmen")+'</b> erreicht einen Reifegrad von <b>'+st.overall+'%</b> ('+lv.t.toLowerCase()+'). '+
 (krit>0?'Es wurden <b>'+krit+' kritische Lücken</b> identifiziert, die vorrangig zu schließen sind.':'Keine kritischen Lücken identifiziert.')+(st.gaps.length>0?' Insgesamt <b>'+st.gaps.length+' Handlungsempfehlungen</b>.':'')+'</p>'+
 (st.strengths.length>0?'<div style="margin-top:12px">'+st.strengths.map(function(s){return '<span class="strength">✓ '+s.t+'</span>';}).join("")+'</div>':'')+'</div>';
 if(st.gaps.length>0){h+='<div class="card"><h3><span style="color:var(--amber)">▲</span> Handlungsbedarf & Empfehlungen</h3><p class="sub">Priorisiert nach Dringlichkeit.</p>'+
  st.gaps.map(function(g){var hoch=g.prio==="hoch";return '<div class="gap"><div class="gap-h"><span class="badge" style="color:'+(hoch?"#C24039":"#B8841F")+';background:'+(hoch?"#F6E6E3":"#F6EDD8")+'">'+(hoch?"Hoch":"Mittel")+'</span><div><div class="gap-q">'+g.q+'</div><div class="gap-sec">'+g.secN+' · '+g.secT+(g.bsig?' · Bezug: '+g.bsig:'')+'</div></div></div><div class="gap-rec"><b>Empfehlung: </b>'+g.rec+'</div></div>';}).join("")+'</div>';}
 if(!S.sent)h+='<div class="cta"><h3>Sollen wir gemeinsam die Lücken schließen?</h3><p>In einem kostenlosen 30-minütigen Erstgespräch priorisieren wir Ihre Handlungsfelder. Schreiben Sie uns an '+CONTACT.mail+'.</p><button class="btn btn-p" data-act="lead">Kostenloses Erstgespräch vereinbaren →</button></div>';
 else h+='<div class="cta"><h3>Vielen Dank, '+esc((S.name||S.firma||"").split(" ")[0])+'!</h3><p style="margin:0">Ihre Auswertung ist eingegangen. Wir melden uns binnen 24 Stunden unter '+esc(S.email)+'.</p></div>';
 return h+foot();
}

document.addEventListener("click",function(e){
 var el=e.target.closest("[data-act]");if(!el)return;var act=el.getAttribute("data-act");
 if(act==="start"){S.phase="quiz";S.sec=0;}
 else if(act==="opt"){S.ans[el.getAttribute("data-qid")]=el.getAttribute("data-val");}
 else if(act==="goto"){S.sec=parseInt(el.getAttribute("data-i"),10);}
 else if(act==="prev"){if(S.sec===0)S.phase="intro";else S.sec--;}
 else if(act==="next"){S.sec++;}
 else if(act==="report"){S.phase="report";}
 else if(act==="edit"){S.phase="quiz";}
 else if(act==="lead"){/* TODO(cybterra): fetch('/api/assessment',{method:'POST',body:JSON.stringify(S)}) */ S.sent=true;}
 else if(act==="print"){window.print();return;}
 else return;
 save();render();
});
document.addEventListener("input",function(e){var el=e.target.closest("input[data-model]");if(!el)return;S[el.getAttribute("data-model")]=el.value;save();});
document.addEventListener("change",function(e){var el=e.target.closest("select[data-model]");if(!el)return;S[el.getAttribute("data-model")]=el.value;save();render();});

render();
