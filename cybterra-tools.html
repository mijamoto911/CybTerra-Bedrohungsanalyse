<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cybterra · Security-Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #efede8;
        --card: #fff;
        --ink: #2a1512;
        --brand: #340b09;
        --bsoft: #f2e7e5;
        --mut: #6e6560;
        --dim: #a79e99;
        --line: #e6e1d9;
        --line2: #d8d0c6;
        --green: #3e8e5a;
        --gsoft: #e9f1ea;
        --amber: #b8841f;
        --asoft: #f6edd8;
        --red: #c24039;
        --rsoft: #f6e6e3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: 'DM Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 840px;
        margin: 0 auto;
        padding: 30px 22px 80px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 22px;
      }
      .wm {
        font-family: 'Poppins';
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .bt {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        margin-top: 1px;
      }
      .back {
        background: none;
        border: none;
        color: var(--mut);
        font-family: 'DM Sans';
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        padding: 0;
        margin-bottom: 18px;
      }
      .back:hover {
        color: var(--brand);
      }
      .eye {
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand);
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .eye::before {
        content: '';
        width: 24px;
        height: 2px;
        background: var(--brand);
      }
      h1.h {
        font-family: Roboto, roboto-bold, sans-serif;
        font-weight: 700;
        font-size: clamp(28px, 5vw, 40px);
        line-height: 1.07;
        letter-spacing: -0.02em;
        margin: 0 0 14px;
      }
      h1.h em {
        font-style: normal;
        color: var(--brand);
      }
      .lead {
        color: var(--mut);
        font-size: 16px;
        line-height: 1.6;
        max-width: 620px;
        margin: 0 0 30px;
      }
      .choose {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .tile {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 26px;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        transition: 0.16s;
        box-shadow: 0 2px 12px rgba(42, 21, 18, 0.04);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .tile:hover {
        border-color: var(--brand);
        transform: translateY(-2px);
        box-shadow: 0 10px 26px rgba(52, 11, 9, 0.1);
      }
      .tile-ic {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--bsoft);
        display: grid;
        place-items: center;
        color: var(--brand);
        font-size: 22px;
      }
      .tile h3 {
        font-family: 'Poppins';
        font-weight: 700;
        font-size: 19px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .tile p {
        color: var(--mut);
        font-size: 14px;
        line-height: 1.55;
        margin: 0;
        flex: 1;
      }
      .tile .go {
        color: var(--brand);
        font-weight: 600;
        font-size: 13.5px;
      }
      .tile .tag {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 16px;
        box-shadow: 0 2px 12px rgba(42, 21, 18, 0.04);
      }
      .card h3 {
        font-family: 'Poppins';
        font-weight: 600;
        font-size: 16px;
        margin: 0 0 4px;
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .card .sub {
        color: var(--mut);
        font-size: 13.5px;
        margin: 0 0 16px;
      }
      .fg {
        display: grid;
        gap: 12px;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .field label {
        display: block;
        font-weight: 600;
        font-size: 10px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--dim);
        margin-bottom: 6px;
      }
      .inp,
      .sel {
        width: 100%;
        background: var(--paper);
        border: 1px solid var(--line2);
        border-radius: 9px;
        padding: 12px 13px;
        color: var(--ink);
        font-family: inherit;
        font-size: 14px;
      }
      .inp:focus,
      .sel:focus {
        outline: none;
        border-color: var(--brand);
      }
      .btn {
        border: none;
        cursor: pointer;
        font-family: 'Poppins';
        font-weight: 600;
        font-size: 14.5px;
        padding: 13px 24px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        transition: 0.14s;
      }
      .btn-p {
        background: var(--brand);
        color: var(--paper);
      }
      .btn-p:hover {
        background: #210706;
        transform: translateY(-1px);
      }
      .btn-p:disabled {
        opacity: 0.36;
        cursor: not-allowed;
        transform: none;
      }
      .btn-g {
        background: var(--card);
        border: 1px solid var(--line2);
        color: var(--mut);
      }
      .btn-g:hover {
        color: var(--ink);
        border-color: var(--dim);
      }
      .meta {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--dim);
        margin-top: 14px;
      }
      .meta span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .meta i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--brand);
        display: inline-block;
      }
      .opts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .optslist {
        display: grid;
        gap: 8px;
      }
      .opt {
        cursor: pointer;
        border: 1.5px solid var(--line2);
        background: var(--paper);
        border-radius: 9px;
        padding: 12px 14px;
        font-family: inherit;
        font-size: 14px;
        color: var(--mut);
        display: flex;
        align-items: center;
        gap: 10px;
        transition: 0.12s;
        text-align: left;
      }
      .opt:hover {
        border-color: var(--dim);
      }
      .opt.on {
        font-weight: 600;
        background: #fff;
      }
      .opt .d {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid currentColor;
        flex: none;
      }
      .opt.on .d {
        background: currentColor;
        box-shadow: inset 0 0 0 2px #fff;
      }
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .pbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--paper);
        padding: 12px 0 14px;
        margin-bottom: 6px;
      }
      .ptop {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .ptop b {
        font-family: 'Poppins';
        font-size: 13.5px;
      }
      .ptop span {
        font-size: 11px;
        color: var(--dim);
      }
      .ptrack {
        height: 5px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .pfill {
        height: 100%;
        background: var(--brand);
        border-radius: 4px;
        transition: width 0.4s;
      }
      .dots {
        display: flex;
        gap: 4px;
        margin-top: 10px;
      }
      .dot {
        flex: 1;
        height: 4px;
        border-radius: 3px;
        background: var(--line);
        cursor: pointer;
      }
      .dot.done {
        background: var(--brand);
      }
      .dot.cur {
        background: var(--ink);
      }
      .secn {
        font-weight: 600;
        font-size: 11.5px;
        color: var(--brand);
        letter-spacing: 0.09em;
      }
      .sect {
        font-family: 'Poppins';
        font-weight: 700;
        font-size: 25px;
        letter-spacing: -0.01em;
        margin: 5px 0 5px;
      }
      .seci {
        color: var(--mut);
        font-size: 15px;
      }
      .q {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 19px 20px;
        margin-bottom: 11px;
        box-shadow: 0 1px 7px rgba(42, 21, 18, 0.03);
      }
      .qnum {
        font-size: 11px;
        color: var(--dim);
        font-weight: 600;
      }
      .qt {
        font-size: 15.5px;
        line-height: 1.5;
        margin: 6px 0 14px;
        font-weight: 500;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .info {
        flex: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid var(--dim);
        color: var(--dim);
        font-size: 11px;
        font-weight: 700;
        font-style: italic;
        font-family: Georgia, serif;
        display: inline-grid;
        place-items: center;
        cursor: help;
        position: relative;
        margin-top: 2px;
        transition: 0.15s;
      }
      .info:hover {
        border-color: var(--brand);
        color: var(--brand);
      }
      .info .tip {
        visibility: hidden;
        opacity: 0;
        position: absolute;
        left: 50%;
        top: 26px;
        transform: translateX(-50%);
        width: 260px;
        max-width: 70vw;
        background: var(--ink);
        color: #f4eee9;
        font-size: 12.5px;
        font-weight: 400;
        font-style: normal;
        font-family: 'DM Sans';
        line-height: 1.5;
        text-align: left;
        padding: 11px 13px;
        border-radius: 9px;
        box-shadow: 0 8px 24px rgba(42, 21, 18, 0.22);
        z-index: 20;
        transition: opacity 0.16s;
        pointer-events: none;
      }
      .info .tip::before {
        content: '';
        position: absolute;
        left: 50%;
        top: -5px;
        transform: translateX(-50%) rotate(45deg);
        width: 9px;
        height: 9px;
        background: var(--ink);
      }
      .info:hover .tip,
      .info:focus .tip {
        visibility: visible;
        opacity: 1;
      }
      @media print {
        .info {
          display: none;
        }
      }
      .nav {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 24px;
      }
      .verdict {
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 16px;
        border: 1px solid;
      }
      .verdict .vt {
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .verdict .vh {
        font-family: 'Poppins';
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.01em;
        margin: 0 0 10px;
      }
      .verdict .vp {
        font-size: 14.5px;
        line-height: 1.6;
        margin: 0;
        opacity: 0.92;
      }
      .verdict .vfine {
        margin-top: 14px;
        font-weight: 600;
        font-size: 13px;
      }
      .conseq {
        display: grid;
        gap: 9px;
        margin-top: 16px;
      }
      .ci {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 14px 16px;
      }
      .ci .k {
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--dim);
        font-weight: 600;
        margin-bottom: 4px;
      }
      .ci .v {
        font-size: 13.5px;
        line-height: 1.5;
      }
      .obl {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-top: 4px;
      }
      .obl span {
        font-size: 12px;
        color: var(--mut);
      }
      .obl span::before {
        content: '▸ ';
        color: var(--brand);
      }
      .rhero {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 26px;
        margin-bottom: 16px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 26px;
        align-items: center;
        box-shadow: 0 2px 14px rgba(42, 21, 18, 0.05);
      }
      .score .big {
        font-family: 'Poppins';
        font-weight: 700;
        font-size: 50px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .score .lbl {
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--dim);
        margin-top: 6px;
        font-weight: 600;
      }
      .rhero-txt h2 {
        font-family: 'Poppins';
        font-weight: 600;
        font-size: 21px;
        margin: 0 0 8px;
      }
      .rlvl {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 20px;
        margin-bottom: 10px;
      }
      .rhero-txt p {
        color: var(--mut);
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
      }
      .chartgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        align-items: center;
      }
      .bars {
        display: grid;
        gap: 9px;
      }
      .barrow {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 5px 12px;
        align-items: center;
      }
      .bart {
        font-size: 12.5px;
      }
      .bart small {
        color: var(--dim);
        margin-right: 6px;
        font-weight: 600;
      }
      .barv {
        font-size: 12px;
        font-weight: 700;
      }
      .bartrack {
        grid-column: 1/-1;
        height: 6px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 5px;
        overflow: hidden;
      }
      .barfill {
        height: 100%;
        border-radius: 5px;
      }
      .mgmt {
        font-size: 14.5px;
        line-height: 1.7;
        color: var(--mut);
      }
      .mgmt b {
        color: var(--ink);
      }
      .strength {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--mut);
        padding: 6px 11px;
        background: var(--gsoft);
        border-radius: 8px;
        margin: 4px 6px 0 0;
      }
      .gap {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 15px 17px;
        margin-bottom: 9px;
        background: var(--card);
      }
      .gap-h {
        display: flex;
        gap: 11px;
        align-items: flex-start;
      }
      .badge {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 4px 9px;
        border-radius: 20px;
        flex: none;
        margin-top: 2px;
      }
      .gap-q {
        font-weight: 600;
        font-size: 14.5px;
        line-height: 1.45;
      }
      .gap-sec {
        font-size: 10.5px;
        color: var(--dim);
        margin-top: 3px;
        font-weight: 500;
      }
      .gap-rec {
        margin-top: 11px;
        padding: 12px 14px;
        background: var(--paper);
        border-radius: 9px;
        font-size: 13.5px;
        line-height: 1.55;
      }
      .gap-rec b {
        color: var(--brand);
      }
      .cta {
        background: var(--brand);
        border-radius: 18px;
        padding: 26px;
        color: var(--paper);
        margin-top: 20px;
      }
      .cta h3 {
        font-family: 'Poppins';
        font-weight: 600;
        font-size: 20px;
        margin: 0 0 8px;
        color: #fff;
      }
      .cta p {
        color: #e3cfcc;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 18px;
      }
      .cta .btn-p {
        background: var(--paper);
        color: var(--brand);
      }
      .cta .btn-p:hover {
        background: #fff;
      }
      .cta .inp {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.25);
        color: #fff;
      }
      .letter {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 18px 22px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-bottom: 16px;
      }
      .letter .li {
        flex: 1;
      }
      .letter .lc {
        text-align: right;
        font-size: 12px;
        color: var(--mut);
        line-height: 1.5;
      }
      .letter .lc b {
        color: var(--brand);
      }
      .foot {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 12px;
        color: var(--mut);
      }
      .foot b {
        color: var(--brand);
      }
      .disc {
        font-size: 10.5px;
        color: var(--dim);
        line-height: 1.7;
        margin-top: 14px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-bottom: 14px;
      }
      @media (max-width: 640px) {
        .choose,
        .row2,
        .opts,
        .chartgrid,
        .rhero,
        .obl {
          grid-template-columns: 1fr;
        }
        .rhero,
        .letter {
          text-align: center;
        }
        .letter .lc {
          text-align: center;
        }
      }
      @media print {
        body {
          background: #fff;
        }
        .toolbar,
        .cta,
        .nav,
        .pbar,
        .back {
          display: none !important;
        }
        .card,
        .rhero,
        .gap,
        .verdict,
        .letter {
          box-shadow: none;
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      var CONTACT = { mail: 'office@cybterra.com', web: 'cybterra.com' };

      /* ---- Kein Icon-Logo — nur Text-Wortmarke wie beim Impactrechner ---- */
      function logo(sz) {
        return '';
      }
      function brand(sub) {
        return (
          '<div class="brand"><div><div class="wm">cybterra' +
          (sub ? ' · ' + sub : '') +
          '</div></div></div>'
        );
      }
      function letter() {
        return (
          '<div class="letter"><div class="li"><div class="wm">cybterra</div><div class="bt">Cyber-Security &amp; NIS2-Compliance</div></div><div class="lc"><b>cybterra</b><br>' +
          CONTACT.mail +
          '<br>' +
          CONTACT.web +
          '</div></div>'
        );
      }
      function foot() {
        return (
          '<div class="foot"><div><b>cybterra</b> · Cyber-Security &amp; NIS2</div><div>' +
          CONTACT.mail +
          ' · ' +
          CONTACT.web +
          '</div></div>' +
          '<p class="disc">Automatisierte Erstorientierung auf Basis Ihrer Selbstauskunft — ersetzt keine individuelle Sicherheitsprüfung oder Rechtsberatung. © cybterra · ' +
          new Date().toLocaleDateString('de-DE') +
          '.</p>'
        );
      }

      /* ---- NIS2-Daten ---- */
      var SEK_I = [
        ['energie', 'Energie'],
        ['transport', 'Transport & Verkehr'],
        ['banken', 'Bankwesen'],
        ['finanz', 'Finanzmarktinfrastruktur'],
        ['gesundheit', 'Gesundheitswesen'],
        ['trinkwasser', 'Trinkwasser'],
        ['abwasser', 'Abwasser'],
        ['diginfra', 'Digitale Infrastruktur (Cloud, RZ, DNS, TK)'],
        ['iktm', 'Verwaltung von IKT-Diensten (B2B)'],
        ['verwaltung', 'Öffentliche Verwaltung'],
        ['weltraum', 'Weltraum'],
      ];
      var SEK_II = [
        ['post', 'Post- & Kurierdienste'],
        ['abfall', 'Abfallbewirtschaftung'],
        ['chemie', 'Chemie'],
        ['lebensmittel', 'Lebensmittel'],
        ['produktion', 'Verarbeitendes Gewerbe / Herstellung'],
        ['digdienste', 'Anbieter digitaler Dienste'],
        ['forschung', 'Forschung'],
      ];
      var ANH_I = {};
      SEK_I.forEach(function (s) {
        ANH_I[s[0]] = 1;
      });
      var SPECIALS = [
        ['kritis', 'KRITIS-Betreiber'],

      /* ---- SVG-Radar (ersetzt recharts) ---- */
      function radar(data) {
        var cx = 160,
          cy = 150,
          R = 108,
          N = data.length,
          rings = 4,
          out = '';
        var pt = function (i, r) {
          var a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
          return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
        };
        for (var g = 1; g <= rings; g++) {
          var rr = (R * g) / rings,
            p = '';
          for (var i = 0; i < N; i++) {
            var c = pt(i, rr);
            p +=
              (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1) + ' ';
          }
          out +=
            '<path d="' +
            p +
            'Z" fill="none" stroke="#DAD3C9" stroke-width="1"/>';
        }
        for (var i = 0; i < N; i++) {
          var e = pt(i, R);
          out +=
            '<line x1="' +
            cx +
            '" y1="' +
            cy +
            '" x2="' +
            e[0].toFixed(1) +
            '" y2="' +
            e[1].toFixed(1) +
            '" stroke="#DAD3C9" stroke-width="1"/>';
        }
        var dp = '';
        for (var i = 0; i < N; i++) {
          var v = Math.max(data[i].score, 3);
          var c = pt(i, (R * v) / 100);
          dp += (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1) + ' ';
        }
        out +=
          '<path d="' +
          dp +
          'Z" fill="#340B09" fill-opacity="0.24" stroke="#340B09" stroke-width="2"/>';
        for (var i = 0; i < N; i++) {
          var l = pt(i, R + 16),
            a = -Math.PI / 2 + (i * 2 * Math.PI) / N,
            an = l[0] < cx - 5 ? 'end' : l[0] > cx + 5 ? 'start' : 'middle';
          out +=
            '<text x="' +
            l[0].toFixed(1) +
            '" y="' +
            (l[1] + 3).toFixed(1) +
            '" font-size="10" font-family="DM Sans" fill="#6E6560" text-anchor="' +
            an +
            '">' +
            esc(data[i].short) +
            '</text>';
        }
        return (
          '<svg viewBox="0 0 320 300" width="100%" height="300">' +
          out +
          '</svg>'
        );
      }

      /* ---- Assessment-Statistik ---- */
      function assessStats() {
        var secs = sectionsA(),
          ans = S.assess.ans,
          valOf = function (v) {
            for (var i = 0; i < OPTS.length; i++)
              if (OPTS[i].v === v) return OPTS[i].val;
          };
        var ss = secs.map(function (s) {
          var rel = s.q.filter(function (q) {
            return ans[q.id] && ans[q.id] !== 'na';
          });
          var sc = rel.length
            ? Math.round(
                (rel.reduce(function (a, q) {
                  return a + valOf(ans[q.id]);
                }, 0) /
                  (rel.length * 2)) *
                  100,
              )
            : null;
          return { id: s.id, short: s.short, t: s.t, n: s.n, score: sc };
        });
        var scored = ss.filter(function (s) {
          return s.score !== null;
        });
        var overall = scored.length
          ? Math.round(
              scored.reduce(function (a, s) {
                return a + s.score;
              }, 0) / scored.length,
            )
          : 0;
        var gaps = [];
        secs.forEach(function (s) {
          s.q.forEach(function (q) {
            if (ans[q.id] === 'nein' || ans[q.id] === 'teilweise')
              gaps.push({
                q: q.q,
                rec: q.rec,
                id: q.id,
                secN: s.n,
                secT: s.t,
                bsig: s.bsig,
                prio: ans[q.id] === 'nein' ? 'hoch' : 'mittel',
              });
          });
        });
        gaps.sort(function (a, b) {
          return (a.prio === 'hoch' ? 0 : 1) - (b.prio === 'hoch' ? 0 : 1);
        });
        var strengths = ss.filter(function (s) {
          return s.score !== null && s.score >= 75;
        });
        var total = 0;
        secs.forEach(function (s) {
          total += s.q.length;
        });
        var answered = 0;
        secs.forEach(function (s) {
          s.q.forEach(function (q) {
            if (ans[q.id]) answered++;
          });
        });
        return {
          ss: ss,
          overall: overall,
          gaps: gaps,
          strengths: strengths,
          total: total,
          answered: answered,
          secs: secs,
        };
      }

                  g.secT +
                  (g.bsig ? ' · Bezug: ' + g.bsig : '') +
                  '</div></div></div><div class="gap-rec"><b>Empfehlung: </b>' +
                  g.rec +
                  '</div></div>'
                );
              })
              .join('') +
            '</div>';
        }
        if (!a.sent)
          h +=
            '<div class="cta"><h3>Sollen wir gemeinsam die Lücken schließen?</h3><p>In einem kostenlosen 30-minütigen Erstgespräch priorisieren wir Ihre Handlungsfelder. Schreiben Sie uns an ' +
            CONTACT.mail +
            '.</p><button class="btn btn-p" data-act="assess-lead">Kostenloses Erstgespräch vereinbaren →</button></div>';
        else
          h +=
            '<div class="cta"><h3>Vielen Dank, ' +
            esc((a.name || a.firma || '').split(' ')[0]) +
            '!</h3><p style="margin:0">Ihre Auswertung ist eingegangen. Wir melden uns binnen 24 Stunden unter ' +
            esc(a.email) +
            '.</p></div>';
        return h + foot();
      }

      /* ================= EVENTS ================= */
      document.addEventListener('click', function (e) {
        var el = e.target.closest('[data-act]');
        if (!el) return;
        var act = el.getAttribute('data-act');
        if (act === 'home') {
          S.view = 'home';
        } else if (act === 'go-nis2') {
          S.view = 'nis2';
          S.nis2.step = 0;
        } else if (act === 'go-assess') {
          S.view = 'assess';
          S.assess.phase = 'intro';
        } else if (act === 'nis2-seg') {
          S.nis2[el.getAttribute('data-field')] = el.getAttribute('data-val');
        } else if (act === 'nis2-special') {
          var v = el.getAttribute('data-val'),
            i = S.nis2.specials.indexOf(v);
          if (i > -1) S.nis2.specials.splice(i, 1);
          else S.nis2.specials.push(v);
        } else if (act === 'nis2-result') {
          S.nis2.step = 1;
        } else if (act === 'nis2-back') {
          S.nis2.step = 0;
        } else if (act === 'nis2-lead') {
          /* TODO(cybterra): fetch('/api/nis2-lead',{method:'POST',body:JSON.stringify(S.nis2)}) */ S.nis2.sent = true;
        } else if (act === 'assess-start') {
          S.assess.phase = 'quiz';
          S.assess.sec = 0;
        } else if (act === 'assess-opt') {
          S.assess.ans[el.getAttribute('data-qid')] =
            el.getAttribute('data-val');
        } else if (act === 'assess-goto') {
          S.assess.sec = parseInt(el.getAttribute('data-i'), 10);
        } else if (act === 'assess-prev') {
          if (S.assess.sec === 0) S.assess.phase = 'intro';
          else S.assess.sec--;
        } else if (act === 'assess-next') {
          S.assess.sec++;
        } else if (act === 'assess-report') {
          S.assess.phase = 'report';
        } else if (act === 'assess-edit') {
          S.assess.phase = 'quiz';
        } else if (act === 'assess-lead') {
          /* TODO(cybterra): fetch('/api/assessment',{method:'POST',body:JSON.stringify(S.assess)}) */ S.assess.sent = true;
        } else if (act === 'print') {
          window.print();
          return;
        } else return;
        save();
        render();
      });
      /* Text-Inputs: Zustand ohne Re-Render aktualisieren (Fokus behalten) */
      document.addEventListener('input', function (e) {
        var el = e.target.closest('[data-model]');
        if (!el) return;
        var path = el.getAttribute('data-model').split('.');
        S[path[0]][path[1]] = el.value;
        save();
      });
      /* Selects: aktualisieren + neu rendern */
      document.addEventListener('change', function (e) {
        var el = e.target.closest('select[data-model]');
        if (!el) return;
        var path = el.getAttribute('data-model').split('.');
        S[path[0]][path[1]] = el.value;
        save();
        render();
      });

      render();
    </script>
  </body>
</html>
